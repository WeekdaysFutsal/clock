name: APK 빌드

# main 브랜치에 파일이 올라올 때마다, 또는 Actions 탭에서 직접 실행할 때 APK를 만듭니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v6

      - name: 자바 17 준비
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: APK 만들기
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: 파일 이름 정하기
        id: apk
        run: |
          VER=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle | head -1)
          DATE=$(TZ=Asia/Seoul date +%Y%m%d)
          FILE="FoldStandby_Ver.${VER}_${DATE}.apk"
          cp app/build/outputs/apk/release/*.apk "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: 빌드 결과로 보관
        uses: actions/upload-artifact@v7
        with:
          name: FoldStandby-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Releases에 올리기
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "${{ steps.apk.outputs.file }}" \
            --target "${{ github.sha }}" \
            --title "스탠바이 Ver.${{ steps.apk.outputs.ver }} (빌드 ${{ github.run_number }})" \
            --notes "휴대폰에서 아래 APK 파일을 내려받아 설치하세요. 기존에 설치한 스탠바이 위에 덮어 설치됩니다."
